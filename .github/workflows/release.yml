name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, MAJOR.MINOR.PATCH without the leading v"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  package:
    name: Package
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == "push" ]]; then
            version="${TAG#v}"
          else
            version="$INPUT"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD: ${{ github.run_number }}
        run: scripts/package.sh "$VERSION" "$BUILD"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: scripts/release-notes.sh "$VERSION" "$REPO" > dist/notes.md

      - name: Upload the artefact to the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HumaneSpaceTab-${{ steps.version.outputs.value }}
          path: dist/

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/HumaneSpaceTab-${{ steps.version.outputs.value }}.zip

  release:
    name: Release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HumaneSpaceTab-${{ needs.package.outputs.version }}
          path: dist

      - name: Check the artefact survived the round trip
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: cd dist && shasum -a 256 -c "HumaneSpaceTab-$VERSION.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="dist/HumaneSpaceTab-$VERSION.zip"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title "$VERSION" --notes-file dist/notes.md --prerelease
            gh release upload "$TAG" --repo "$REPO" --clobber "$zip" "$zip.sha256"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "$VERSION" --notes-file dist/notes.md --prerelease \
              "$zip" "$zip.sha256"
          fi
