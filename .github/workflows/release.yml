name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, MAJOR.MINOR.PATCH without the leading v"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  package:
    name: Package
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [[ "$EVENT" == "push" ]]; then
            version="${TAG#v}"
          else
            version="$INPUT"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.value }}
          BUILD: ${{ github.run_number }}
        run: scripts/package.sh "$VERSION" "$BUILD"

      - name: Write the Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: scripts/cask.sh "$VERSION" "$REPO" > dist/humane-space-tab.rb

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
          REPO: ${{ github.repository }}
        run: scripts/release-notes.sh "$VERSION" "$REPO" > dist/notes.md

      - name: Upload the artefact to the run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: HumaneSpaceTab-${{ steps.version.outputs.value }}
          path: dist/

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/HumaneSpaceTab-${{ steps.version.outputs.value }}.zip
            dist/HumaneSpaceTab-${{ steps.version.outputs.value }}.dmg

  release:
    name: Release
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the artefact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: HumaneSpaceTab-${{ needs.package.outputs.version }}
          path: dist

      - name: Check the artefact survived the round trip
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          cd dist
          shasum -a 256 -c "HumaneSpaceTab-$VERSION.zip.sha256"
          shasum -a 256 -c "HumaneSpaceTab-$VERSION.dmg.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          zip="dist/HumaneSpaceTab-$VERSION.zip"
          dmg="dist/HumaneSpaceTab-$VERSION.dmg"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title "$VERSION" --notes-file dist/notes.md --prerelease
            gh release upload "$TAG" --repo "$REPO" --clobber \
              "$dmg" "$dmg.sha256" "$zip" "$zip.sha256"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "$VERSION" --notes-file dist/notes.md --prerelease \
              "$dmg" "$dmg.sha256" "$zip" "$zip.sha256"
          fi

      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAP_REPO: ${{ vars.TAP_REPO || format('{0}/homebrew-tap', github.repository_owner) }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          token="${TAP_TOKEN//[[:space:]]/}"
          if [[ -z "$token" ]]; then
            echo "::notice::no TAP_TOKEN secret, so the cask stays where it is — docs/homebrew.md says how to set one up"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:$token@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Casks
          cp dist/humane-space-tab.rb tap/Casks/humane-space-tab.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/humane-space-tab.rb
          if git diff --cached --quiet; then
            echo "the tap already carries $VERSION"
            exit 0
          fi
          git commit -m "humane-space-tab $VERSION"
          git push
