name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Crash reports
        if: failure()
        run: |
          shopt -s nullglob
          for report in ~/Library/Logs/DiagnosticReports/*.ips; do
            echo "::group::$(basename "$report")"
            head -120 "$report"
            echo "::endgroup::"
          done

  lint:
    name: Lint and format
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install tools
        run: brew install swiftlint swift-format
      - name: SwiftLint
        run: swiftlint lint --quiet --strict
      - name: Format check
        run: swift-format lint --recursive --strict Sources Tests Package.swift

  bundle:
    name: App bundle
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and check the release bundle
        env:
          BUILD: ${{ github.run_number }}
        run: scripts/package.sh 0.0.0 "$BUILD"
