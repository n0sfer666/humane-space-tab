included:
  - Sources
  - Tests

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - todo
  - trailing_comma

line_length:
  warning: 120
  error: 140

file_length:
  warning: 200
  error: 250

type_body_length:
  warning: 150
  error: 200

function_body_length:
  warning: 40
  error: 60

cyclomatic_complexity:
  warning: 8
  error: 12

identifier_name:
  min_length: 2

nesting:
  type_level: 2
